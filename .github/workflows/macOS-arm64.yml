# Attract-Mode Plus for Apple Silicon: build, sign, notarize, package as DMG.
#
# This is the fork's own workflow. The other files in this folder are oomek's,
# kept exactly as upstream has them (and disabled on the Actions tab), so that
# syncing with upstream never runs into conflicts here.
#
# What starts it:
#   - a push to master          -> signed + notarized DMG under "Artifacts" on the run page
#   - pushing a tag (e.g. 3.2.4) -> the same, plus a draft GitHub Release with the DMG attached
#   - the "Run workflow" button on the Actions tab
#
# Secrets used (Settings -> Secrets and variables -> Actions):
#   MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD

name: macOS ARM64 - signed DMG

on:
  push:
    branches:
      - master
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write                 # allows the job to create the draft release

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"    # don't let Homebrew update itself before every install
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  MACOSX_DEPLOYMENT_TARGET: "15.0" # oldest macOS the app should run on

jobs:

  build:
    name: Build, sign and notarize (ARM64)
    # Pinned on purpose: macos-latest is macOS 26, and everything built there
    # (including the bundled Homebrew libraries) would then require macOS 26.
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        path: am
        fetch-depth: 0            # full history + tags: appbuilder.sh reads the version from the latest tag

    - name: Prepare
      id: vars
      run: |
        echo "nbproc=$(getconf _NPROCESSORS_ONLN)" >> $GITHUB_OUTPUT
        fe_version=
        [[ ${GITHUB_REF} =~ ^refs/tags/* ]] && fe_version="${GITHUB_REF#refs/*/}"
        echo "fe_version=${fe_version}" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        brew update
        brew install pkgconfig ffmpeg libarchive libvorbis flac jpeg-turbo create-dmg

    - name: Build Attract-Mode Plus
      run: |
        make -C am -j${{ steps.vars.outputs.nbproc }} \
          VERBOSE=1 \
          FE_VERSION=${{ steps.vars.outputs.fe_version }} \
          prefix=.. \
          USE_SYSTEM_SFML=0 \
          STATIC=0

    - name: Build app bundle
      run: |
        mkdir -p artifacts
        bash am/util/osx/appbuilder.sh

    - name: Sign, notarize and package DMG
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      run: bash am/util/osx/sign_notarize_dmg.sh artifacts arm64

    - name: Upload DMG
      uses: actions/upload-artifact@v7
      with:
        name: AttractModePlus-macOS-arm64
        path: artifacts/*.dmg

    - name: Create draft release (tags only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Attract-Mode Plus ${{ github.ref_name }} for Apple Silicon
        draft: true               # you review and publish it yourself on the Releases page
        files: artifacts/*.dmg
